[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "masala1"
version = "0.1.0"
description = "Uch qatlamli muhitda suv filtratsiyasi: sig'imli ajratuvchilar, K(x,y), bosimsiz yuqori qatlam"
authors = [{name = "Javokhir Erkinov"}]
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]
modflow = ["flopy"]

[tool.setuptools]
packages = ["masala1"]
